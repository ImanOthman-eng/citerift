name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python }}
      # The checks run the checked-out src/ modules (Stage 00 owned paths) with -P, so neither the
      # entry points in pyproject.toml nor a package in the working directory can replace them.
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Check out full history (revision checks need it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Nothing beside the citerift package in src
        # With src on PYTHONPATH, a src/sitecustomize.py or a package shadowing a dependency would run
        # before every check below (X-04). This step runs no Python, so such a file cannot affect it.
        run: test "$(ls -A src)" = "citerift"

      - name: No committed environment
        # A committed .venv would run its interpreter when uv first queries it, before the governance check
        # (R5-01 of the fix check). This step runs no Python either.
        run: test ! -e .venv && test ! -L .venv

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python }}
          enable-cache: false

      - name: Install the locked dependencies only, as wheels
        # Reads uv.lock alone. Neither the project nor any source distribution is built, so no build backend
        # that pyproject.toml names runs before the governance check (Z-04).
        run: uv sync --frozen --no-install-project --no-build

      - name: Governance state and memory consistency
        # Runs before any tool that pyproject.toml configures: a build backend, or a mypy, ruff or pytest
        # setting, can run code, which could rewrite the checker on disk before a later check step (Y-08, Z-04).
        # The package is not installed yet; it is imported from src (PYTHONPATH), which the first step guards.
        run: |
          uv run --no-sync python -P -m citerift.governance.cli check
          uv run --no-sync python -P -m citerift.governance.cli render-status --check

      - name: Lockfile is up to date
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --locked

      - name: Package is imported from the checkout
        run: >-
          uv run --no-sync python -P -c "import citerift, pathlib, sys;
          sys.exit(not pathlib.Path(citerift.__file__).resolve().is_relative_to(pathlib.Path('src').resolve()))"

      - name: Static analysis (ruff lint and format, mypy strict)
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy

      - name: Schema validation
        run: uv run --no-sync python -P -m citerift.contracts.validate check-schemas

      - name: Tests (orchestrator, memory, contracts, integration, recovery, simulation)
        run: uv run --no-sync python -P -m pytest --citerift-report ci-test-report.json

      - name: Test report records a complete run of a clean tree
        # A green run must not come from a partial one, for example with tests skipped (O-6, Y-03).
        run: uv run --no-sync python -P -m citerift.governance.cli check-report ci-test-report.json

      - name: No file was changed or added by the steps above
        # A tool configured in pyproject.toml could rewrite tracked files, the checker included (Y-08). The diff
        # shows unstaged changes; the status also catches staged changes and new files (D4 of the confirmation
        # review). The test report is the one file the steps add.
        run: |
          git diff --exit-code
          changes="$(git status --porcelain=v1 --untracked-files=all | grep -vx '?? ci-test-report.json' || true)"
          test -z "$changes" || { echo "$changes"; exit 1; }

      - name: Dependency vulnerability audit
        run: |
          uv export --locked --format requirements-txt --no-emit-project --all-groups > audit-requirements.txt
          uv run --no-sync pip-audit --strict --disable-pip --require-hashes -r audit-requirements.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-python-${{ matrix.python }}
          path: ci-test-report.json
          if-no-files-found: warn
          retention-days: 30

  ci-gate:
    name: ci-gate
    if: always()
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded
        env:
          RESULT: ${{ needs.verify.result }}
        run: |
          echo "verify matrix result: $RESULT"
          test "$RESULT" = "success"
